<script>
    const urlParams = new URLSearchParams(window.location.search);
    const eventName = urlParams.get('name') || "Event";
    const eventCategory = urlParams.get('cat') || "Tech";
    // Extract the WhatsApp link parameter
    const waLink = urlParams.get('wa');

    document.getElementById('form-title').innerText = `Register for ${eventName}`;
    document.getElementById('eventName').value = eventName;
    document.getElementById('eventCategory').value = eventCategory;

    // Make sure this matches your deployed Apps Script URL
    const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbxkkzGS8mEcLY0qJiwbIPaNBaRO2hbm0Dz-mVj1d4wJdqrTZWrVLJo9F7xFTNqnbP87Lg/exec'; 
    
    const form = document.getElementById('studentRegisterForm');
    const submitBtn = document.getElementById('submitBtn');
    const formWrapper = document.getElementById('formWrapper');

    form.addEventListener('submit', event => {
      event.preventDefault();
      
      submitBtn.disabled = true;
      submitBtn.innerText = "Processing submission...";

      // Re-encode the payload exactly as Google Apps Script expects it
      const encodedPayload = new URLSearchParams(new FormData(form));

      // Put 'no-cors' back so the browser doesn't block the request!
      fetch(BACKEND_URL, { 
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: encodedPayload 
      })
      .then(res => {
        // Since we are using no-cors, the request resolving means it successfully sent the data
        
        let successHTML = `
          <div style="text-align: center; padding: 30px 10px; animation: slideFadeIn 0.5s ease-out;">
            <h2 style="color: var(--lavender); font-family: 'Playfair Display', serif; margin-bottom: 15px; font-size: 2rem;">Registration Successful! 🎉</h2>
            <p style="color: var(--text-muted); font-size: 1rem; line-height: 1.6; margin-bottom: 30px;">
              Your details for <strong>${eventName}</strong> have been securely recorded. Thank you for signing up!
            </p>
        `;
        
        // Add WhatsApp button if link exists
        if (waLink && waLink.trim() !== '' && waLink !== 'undefined') {
          successHTML += `
            <p style="color: var(--text); margin-bottom: 15px; font-family: 'Space Mono', monospace; font-size: 0.8rem; letter-spacing: 0.1em;">
              FOLLOW FOR MORE UPDATES:
            </p>
            <a href="${waLink}" target="_blank" style="
              display: inline-block;
              font-family: 'Space Mono', monospace;
              font-size: 0.8rem;
              text-transform: uppercase;
              padding: 14px 28px;
              background: #25D366;
              color: #000;
              font-weight: bold;
              text-decoration: none;
              clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
              transition: transform 0.2s, box-shadow 0.2s;
            " onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 10px 20px rgba(37, 211, 102, 0.3)';" 
               onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='none';">
              🔗 Join WhatsApp Group
            </a>
          `;
        }
        
        successHTML += `
            <br><br>
            <a href="index.html" style="color: var(--lavender); font-family: 'Space Mono', monospace; font-size: 0.75rem; text-decoration: none; border-bottom: 1px solid var(--border-soft); margin-top: 30px; display: inline-block;">
              &larr; Return to Homepage
            </a>
          </div>
        `;
        
        // Render success message
        formWrapper.innerHTML = successHTML;
      })
      .catch(err => {
        console.error("Network Error:", err.message);
        submitBtn.disabled = false;
        submitBtn.innerText = "Retry Submission";
        alert("A network error occurred. Please try again.");
      });
    });
  </script>
