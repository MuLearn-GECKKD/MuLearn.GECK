 <!-- Execom Section (Dynamic) -->
  <section id="execom" style="padding-top: 140px; min-height: 100vh;">
    <div class="wrap">
      <div class="section-eyebrow">Leadership</div>
      <h2 class="section-heading">Our <span class="accent">Execom</span></h2>
      
      <!-- We added the id="execomGrid" here -->
      <div class="execom-grid" id="execomGrid">
        <p style="text-align: center; color: var(--text-muted); grid-column: 1 / -1; font-family: 'Space Mono', monospace;">
          Loading Execom data...
        </p>
      </div>
      
    </div>
  </section>

  <!-- Paste your exact existing footer here -->
  <footer>
    <div class="footer-brand">µLearn GEC Kozhikode</div>
    <div class="footer-copy">
      © 2026 µLearn GECK — Official Campus Chapter<br/>
      Web Administrator: Nandana K
    </div>
  </footer>

<script>
    const EXECOM_API_URL = 'https://script.google.com/macros/s/AKfycbxkkzGS8mEcLY0qJiwbIPaNBaRO2hbm0Dz-mVj1d4wJdqrTZWrVLJo9F7xFTNqnbP87Lg/exec?tab=Execom'; 

    function getDirectDriveImageUrl(url) {
      if (!url) return '';
      const trimmed = url.trim();
      if (!trimmed.includes('drive.google.com')) return trimmed;
      const match = trimmed.match(/\/file\/d\/([a-zA-Z0-9-_]+)/) || trimmed.match(/id=([a-zA-Z0-9-_]+)/);
      if (match && match[1]) {
        return `https://drive.google.com/thumbnail?sz=w1200&id=${match[1]}`;
      }
      return trimmed;
    }

    // Extracted the rendering logic into its own function
    function renderExecomGrid(data) {
      const grid = document.getElementById('execomGrid');
      grid.innerHTML = ''; 
      
      data.forEach((member, index) => {
        if(!member.name) return; 

        const imgUrl = getDirectDriveImageUrl(member.image);
        const delay = (index % 4) * 0.1; 

        const tileHTML = `
          <div class="execom-card" style="animation: slideFadeIn 0.4s ease-in-out forwards; animation-delay: ${delay}s; opacity: 0;">
            <div class="execom-photo-wrap">
              <img class="execom-photo" src="${imgUrl}" alt="${member.name}" onerror="this.parentElement.innerHTML='<div class=\\'team-photo-placeholder\\'>👨‍💻</div>'">
            </div>
            <div class="execom-info">
              <div class="execom-name">${member.name}</div>
              <div class="execom-role">${member.role}</div>
              ${member.linkedin ? `<a class="execom-linkedin" href="${member.linkedin}" target="_blank">🔗 LinkedIn</a>` : ''}
            </div>
          </div>
        `;
        
        grid.innerHTML += tileHTML;
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('execomGrid');
      
      // 1. Check if the browser already has the data saved
      const cachedExecomData = sessionStorage.getItem('execomData');
      
      if (cachedExecomData) {
        // Render instantly from local storage
        renderExecomGrid(JSON.parse(cachedExecomData));
      } else {
        // 2. If not, fetch from Google Script
        fetch(EXECOM_API_URL)
          .then(response => response.json())
          .then(data => {
            // Save it to the browser for next time
            sessionStorage.setItem('execomData', JSON.stringify(data));
            // Render the grid
            renderExecomGrid(data);
          })
          .catch(error => {
            console.error('Error fetching Execom data:', error);
            grid.innerHTML = `<p style="text-align: center; color: #ff5252; grid-column: 1 / -1;">Failed to load data. Please check the API connection.</p>`;
          });
      }
    });
  </script>
</body>
</html>
